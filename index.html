<head data-page-node-id="FAjdGvOaMD36QpIMJfwXhu">
<meta charset="utf-8" data-page-node-id="JMcgUfUG4SjQcy8btzTAwM">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" data-page-node-id="3FMfmoSFgC4lmlgweIBKAn">
<title>音符弹跳 · NEON BOUNCE</title>
<style>
  :root{
    --bg:#070717;
    --pane:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.12);
    --txt:#eaf0ff;
    --dim:#8b93b8;
    --cy:#39e6ff;
    --pk:#ff4fd8;
    --yl:#ffd84a;
    --gn:#5bffa5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #1d1b4a 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #3a1140 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  #stage{
    position:relative;
    height:100vh;height:100dvh;
    aspect-ratio:460/820;
    max-width:100vw;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08) inset;
    background:#08071a;
    touch-action:none;
    user-select:none;
  }
  @media (max-width:520px){
    #stage{border-radius:0;box-shadow:none}
  }
  canvas{display:block;width:100%;height:100%}
  #stage.aim canvas{cursor:none}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;inset:0;pointer-events:none;
    padding:14px 16px;
    display:flex;flex-direction:column;gap:10px;
    font-variant-numeric:tabular-nums;
  }
  .hud-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .chip{
    background:rgba(10,10,30,.42);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(8px);
    border-radius:12px;padding:6px 11px;
    display:flex;flex-direction:column;line-height:1.05;
  }
  .chip .k{font-size:10px;color:var(--dim);letter-spacing:.16em}
  .chip .v{font-size:20px;font-weight:800}
  .chip.small .v{font-size:14px;font-weight:600;color:var(--cy)}
  .track-name{
    max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #comboChip{transition:transform .12s ease}
  #comboChip.hit{transform:scale(1.18)}
  #comboChip .v{color:var(--yl)}

  /* ---------- 遮罩面板 ---------- */
  .screen{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(6,6,22,.92), rgba(10,6,30,.96));
    backdrop-filter:blur(14px);
    display:flex;flex-direction:column;
    padding:22px 20px 20px;
    overflow:hidden;
  }
  .screen[hidden]{display:none}
  .title{
    font-size:30px;font-weight:900;letter-spacing:.04em;
    background:linear-gradient(90deg,var(--cy),var(--pk) 60%,var(--yl));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin:6px 0 2px;
  }
  .sub{font-size:12px;color:var(--dim);margin-bottom:14px;letter-spacing:.05em}
  .card{
    background:var(--pane);border:1px solid var(--line);
    border-radius:16px;padding:12px;
  }
  .lbl{
    font-size:10.5px;letter-spacing:.18em;color:var(--dim);
    margin:0 0 8px 2px;display:flex;justify-content:space-between;align-items:center;
  }

  /* 曲目列表 */
  .search{
    width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:8px 11px;font-size:13px;
    outline:none;margin-bottom:8px;font-family:inherit;
  }
  .search:focus{border-color:var(--cy)}
  .list{
    flex:1;overflow-y:auto;overflow-x:hidden;
    display:flex;flex-direction:column;gap:6px;
    padding-right:4px;margin:0 -2px;
    -webkit-overflow-scrolling:touch;
  }
  .list::-webkit-scrollbar{width:4px}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  .song{
    display:flex;align-items:center;gap:10px;
    padding:9px 11px;border-radius:12px;cursor:pointer;
    border:1px solid transparent;
    background:rgba(255,255,255,.04);
    transition:background .15s,border-color .15s,transform .08s;
  }
  .song:active{transform:scale(.985)}
  .song.on{
    background:linear-gradient(90deg, rgba(57,230,255,.18), rgba(255,79,216,.14));
    border-color:rgba(57,230,255,.55);
  }
  .song .tag{
    font-size:9.5px;padding:2px 6px;border-radius:6px;flex:none;
    background:rgba(255,255,255,.12);color:var(--dim);letter-spacing:.06em;
  }
  .song.on .tag{background:var(--cy);color:#04202a;font-weight:800}
  .song .m{min-width:0;flex:1}
  .song .t{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .song .s{font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 难度 */
  .diffs{display:flex;gap:6px}
  .diffs button{
    flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--dim);border-radius:11px;padding:9px 4px;font-size:12.5px;
    cursor:pointer;font-family:inherit;transition:.15s;
  }
  .diffs button.on{
    background:linear-gradient(135deg,rgba(57,230,255,.22),rgba(255,79,216,.18));
    border-color:var(--cy);color:#fff;font-weight:800;
  }

  /* 按钮 */
  .btn{
    margin-top:12px;width:100%;
    background:linear-gradient(90deg,var(--cy),var(--pk));
    color:#07121a;border:none;border-radius:15px;
    padding:15px;font-size:17px;font-weight:900;letter-spacing:.1em;
    cursor:pointer;font-family:inherit;
    box-shadow:0 10px 30px rgba(57,230,255,.28);
    transition:transform .08s, filter .15s;
  }
  .btn:active{transform:translateY(2px);filter:brightness(1.1)}
  .btn.ghost{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    box-shadow:none;font-size:14px;padding:12px;letter-spacing:.06em;font-weight:700;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px}
  .row .btn{flex:1}

  .tips{
    margin-top:10px;font-size:11px;line-height:1.75;color:var(--dim);
  }
  .tips b{color:var(--cy);font-weight:700}
  .empty{text-align:center;color:var(--dim);font-size:12px;padding:24px 8px;line-height:1.8}

  /* 结束面板 */
  .big{font-size:56px;font-weight:900;line-height:1;
    background:linear-gradient(90deg,var(--yl),var(--pk));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stat{display:flex;gap:8px;margin-top:12px}
  .stat .card{flex:1;text-align:center}
  .stat .n{font-size:22px;font-weight:900}
  .stat .k{font-size:10px;color:var(--dim);letter-spacing:.14em;margin-top:2px}
  #overTitle{font-size:13px;letter-spacing:.2em;color:var(--dim)}

  /* loading */
  #loading .screen-in{margin:auto;text-align:center}
  .spin{
    width:46px;height:46px;margin:0 auto 16px;
    border:3px solid rgba(255,255,255,.14);
    border-top-color:var(--cy);border-radius:50%;
    animation:sp 0.8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  #loadTxt{font-size:13px;color:var(--dim);letter-spacing:.1em}
  .bar{width:190px;height:4px;background:rgba(255,255,255,.1);border-radius:4px;margin:14px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--cy),var(--pk));
    animation:bd 1.1s ease-in-out infinite}
  @keyframes bd{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}

  .toast{
    position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
    background:rgba(0,0,0,.6);border:1px solid var(--line);
    color:var(--txt);font-size:12px;padding:8px 14px;border-radius:20px;
    pointer-events:none;opacity:0;transition:opacity .25s;
  }
  .toast.show{opacity:1}
  .fab{
    position:absolute;right:14px;top:14px;z-index:5;
    background:rgba(10,10,30,.5);border:1px solid var(--line);
    color:var(--dim);border-radius:10px;width:34px;height:34px;
    font-size:15px;cursor:pointer;line-height:1;
  }
</style>
</head>
